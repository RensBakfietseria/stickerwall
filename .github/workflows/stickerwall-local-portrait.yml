name: Sticky Wall local portrait engines

on:
  push:
    branches:
      - stickerwall-0-3-local-portrait-compare
  pull_request:
    paths:
      - 'local_portrait/**'
      - 'src/stickerwall/**'
      - 'stickerwall.html'
      - 'vite.stickerwall.config.ts'
      - '.github/workflows/stickerwall-local-portrait.yml'
  workflow_dispatch:

jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install Pillow
      - name: Test local engine contracts and missing dependencies
        run: python -m unittest discover -s local_portrait -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stickerwall:build
      - run: npm run typecheck

  engine-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official G'MIC 4.0.8 CLI on Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "gmic.zip"
          $folder = Join-Path $env:RUNNER_TEMP "gmic"
          Invoke-WebRequest -Uri "https://gmic.eu/get_file.php?file=windows%2Fgmic_4.0.8_cli_win64.zip" -OutFile $zip
          Get-FileHash -Path $zip -Algorithm SHA256 | Format-List
          Expand-Archive -Path $zip -DestinationPath $folder -Force
          $exe = Get-ChildItem -Path $folder -Filter "gmic.exe" -Recurse | Select-Object -First 1
          if (!$exe) { throw "Geen gmic.exe gevonden in de officiele CLI-download." }
          "STICKERWALL_GMIC=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $exe.FullName -version
      - name: Install ONNX Runtime CPU and Pillow
        run: python -m pip install -r local_portrait/requirements.txt
      - name: Download pinned models and filter scripts (no portrait data)
        run: python local_portrait/download_assets.py
      - name: Real CPU inference smoke test with synthetic picture
        run: python local_portrait/smoke_test.py

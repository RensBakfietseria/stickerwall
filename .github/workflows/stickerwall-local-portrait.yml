name: Sticky Wall local portrait engines

on:
  push:
    branches:
      - stickerwall-0-11-fantasy
      - stickerwall-0-12-atelier
  pull_request:
    paths:
      - 'local_portrait/**'
      - 'src/stickerwall/**'
      - 'stickerwall.html'
      - 'vite.stickerwall.config.ts'
      - '.github/workflows/stickerwall-local-portrait.yml'
  workflow_dispatch:

jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install Pillow numpy
      - name: Test local engine contracts and missing dependencies
        run: python -m unittest discover -s local_portrait -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stickerwall:build
      - run: npm run typecheck
      - run: npx vitest run test/stickerwall.test.ts test/stickerwall-ink.test.ts test/stickerwall-u2-finish.test.ts test/stickerwall-u2-adaptive.test.ts test/stickerwall-collectible.test.ts test/stickerwall-composition.test.ts test/stickerwall-fantasy.test.ts test/stickerwall-free-scene.test.ts

  engine-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install using the same one-command setup as the Windows user
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\local_portrait\setup.ps1
      - name: Download public upstream sample for local model tests
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/yakhyo/face-parsing/4f0632b17a3e729a7871683aab7c89b6a595da9f/assets/images/1.jpg" -OutFile "$env:RUNNER_TEMP\stickerwall-public-face.jpg"
      - name: Real CPU inference with all five drawing variants
        shell: pwsh
        run: '& .\.local-portrait-venv\Scripts\python.exe local_portrait\smoke_test.py "$env:RUNNER_TEMP\stickerwall-public-face.jpg"'

      - name: Real browser test of U2 presets and optional references on public upstream fixture
        shell: pwsh
        run: node local_portrait/browser_smoke.mjs "$env:RUNNER_TEMP\stickerwall-public-face.jpg"
      - name: Real Cartoon First browser and persistent batch test
        shell: pwsh
        run: node local_portrait/cartoon_smoke.mjs "$env:RUNNER_TEMP\stickerwall-public-face.jpg"
      - name: Real Collectibles and composition browser and print export test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\collectible-exports"
          node local_portrait/collectible_smoke.mjs "$env:RUNNER_TEMP\stickerwall-public-face.jpg" "$env:RUNNER_TEMP\collectible-exports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.local-portrait-venv\Scripts\python.exe -m pip install pypdf
          & .\.local-portrait-venv\Scripts\python.exe local_portrait\check_collectible_exports.py "$env:RUNNER_TEMP\collectible-exports"
      - name: Verify setup is reusable
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\local_portrait\setup.ps1

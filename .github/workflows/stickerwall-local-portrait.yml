name: Sticky Wall local portrait engines

on:
  push:
    branches:
      - stickerwall-0-3-local-portrait-compare
  pull_request:
    paths:
      - 'local_portrait/**'
      - 'src/stickerwall/**'
      - 'stickerwall.html'
      - 'vite.stickerwall.config.ts'
      - '.github/workflows/stickerwall-local-portrait.yml'
  workflow_dispatch:

jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install Pillow
      - name: Test local engine contracts and missing dependencies
        run: python -m unittest discover -s local_portrait -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stickerwall:build
      - run: npm run typecheck

  engine-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install G'MIC CLI and CPU inference requirements
        run: |
          sudo apt-get update -qq
          curl -fLsS 'https://gmic.eu/get_file.php?file=linux%2Fgmic_4.0.8_ubuntu24-04_noble_amd64.deb' -o /tmp/gmic-current.deb
          sudo apt-get install -y /tmp/gmic-current.deb
          gmic -version
          python -m pip install -r local_portrait/requirements.txt
      - name: Download pinned models and filter scripts (no portrait data)
        run: python local_portrait/download_assets.py
      - name: Real CPU inference smoke test with synthetic picture
        run: python local_portrait/smoke_test.py
